name: Bug report
description: Report a reproducible KARZOUN ERP defect
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KARZOUN ERP. Never attach real customer databases, credentials, invoices, personal data, or private business records.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide exact steps using synthetic or redacted data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KARZOUN ERP version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET runtime/SDK, architecture, and install type.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs and screenshots are welcome after removing sensitive business data.
